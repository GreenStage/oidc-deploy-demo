name: deploy

# Builds the site, proves the job's identity with its GitHub OIDC token, exchanges it for a short-lived
# access token, and records the deployment in an internal console. No long-lived deploy credential is stored
# for the job's identity. All endpoints are repository secrets so they are masked in logs.

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment label shown in the console (default: the branch name)"
        required: false

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AUTH_URL: ${{ secrets.DEPLOY_AUTH_URL }}
      APP_URL: ${{ secrets.DEPLOY_APP_URL }}
      OIDC_AUDIENCE: ${{ vars.DEPLOY_OIDC_AUDIENCE }}
      TARGET_AUDIENCE: ${{ vars.DEPLOY_TARGET_AUDIENCE }}
      TOKEN_PATH: /_access/oauth/token
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_CLIENT_SECRET: ${{ secrets.EDGE_CLIENT_SECRET }}
      DEPLOY_ENV: ${{ inputs.environment || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          mkdir -p dist
          sed -e "s/__VERSION__/$version/g" -e "s/__SHA__/${GITHUB_SHA::7}/g" site/index.html > dist/index.html
          sleep 5
          echo "built version $version at ${GITHUB_SHA::7}"

      - name: Check configuration
        id: cfg
        run: |
          missing=()
          for v in AUTH_URL APP_URL OIDC_AUDIENCE TARGET_AUDIENCE EDGE_CLIENT_ID EDGE_CLIENT_SECRET; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::Deploy skipped: missing secrets or variables (${missing[*]}). See README."
            echo "## Deploy skipped: missing secrets or variables" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Define helpers
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          # helpers for the next steps: shorten a token for display, print a JWT's payload (the middle part, base64url) as JSON
          cat > "$RUNNER_TEMP/jwt.sh" <<'EOF'
          short() { printf '%s…(%d chars)' "${1:0:20}" "${#1}"; }
          jwt_payload() {
            local p; p=$(cut -d. -f2 <<<"$1" | tr '_-' '/+')
            while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
            base64 -d <<<"$p" | jq .
          }
          EOF
          echo "BASH_ENV=$RUNNER_TEMP/jwt.sh" >> "$GITHUB_ENV"

      - name: Get the GitHub OIDC token
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cat <<EOF
          \$ curl -H "Authorization: bearer \$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \\
              "\$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE"
          EOF
          resp=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -rn --arg a "$OIDC_AUDIENCE" '$a|@uri')")
          token=$(jq -r '.value' <<<"$resp")
          echo "{\"value\": \"$(short "$token")\"}"
          echo
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > "$RUNNER_TEMP/oidc.jwt"
          echo "got an OIDC token for ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
          echo "::group::GitHub OIDC token payload (claims only; the signature is not printed, secret values show as ***)"
          jwt_payload "$token"
          echo "::endgroup::"

      - name: Exchange it for an access token
        id: exchange
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/exchange.json"
          cat <<EOF
          \$ curl -X POST https://<Access team domain>$TOKEN_PATH \\
              -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \\
              -d subject_token=$(short "$(cat "$RUNNER_TEMP/oidc.jwt")") \\
              -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \\
              -d audience=$TARGET_AUDIENCE
          EOF
          status=000
          for attempt in 1 2 3; do
            status=$(curl -sS -o "$out" -w '%{http_code}' --max-time 30 -X POST "${AUTH_URL%/}$TOKEN_PATH" \
              -H "CF-Access-Client-Id: $EDGE_CLIENT_ID" -H "CF-Access-Client-Secret: $EDGE_CLIENT_SECRET" \
              --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              --data-urlencode "subject_token=$(cat "$RUNNER_TEMP/oidc.jwt")" \
              --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
              --data-urlencode "audience=$TARGET_AUDIENCE" || echo 000)
            case "$status" in 000|5??) echo "attempt $attempt: HTTP $status, retrying"; sleep 3 ;; *) break ;; esac
          done
          echo "HTTP $status"
          jq 'if .access_token then .access_token = (.access_token[0:20] + "…") else . end' "$out" 2>/dev/null || cat "$out"
          echo
          if [ "$status" != 200 ] || ! jq -e '.access_token' "$out" >/dev/null 2>&1; then
            error=$(jq -r '.error // empty' "$out" 2>/dev/null || true)
            desc=$(jq -r '.error_description // empty' "$out" 2>/dev/null || true)
            echo "::error title=Token exchange refused::${error:-HTTP $status}${desc:+: $desc} (HTTP $status)"
            echo "## ❌ Token exchange refused: ${error:-HTTP $status}${desc:+ — $desc} (HTTP $status)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          access=$(jq -r '.access_token' "$out")
          echo "::add-mask::$access"
          umask 077
          printf '%s' "$access" > "$RUNNER_TEMP/access.jwt"
          echo "access token issued (expires in $(jq -r '.expires_in' "$out")s)"
          echo "::group::Access token payload (claims only; the signature is not printed, secret values show as ***)"
          jwt_payload "$access"
          echo "::endgroup::"

      - name: Record the deployment
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/deploy.json"
          payload=$(jq -nc \
            --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg environment "$DEPLOY_ENV" \
            --arg message "$(git log -1 --format=%s)" --arg version "$(cat VERSION)" \
            '{repo: $repo, ref: $ref, sha: $sha, run_id: $run_id, run_url: $run_url, environment: $environment, message: $message, version: $version}')
          cat <<EOF
          \$ curl -X POST https://<Deploy Console>/api/deployments \\
              -H "Authorization: Bearer $(short "$(cat "$RUNNER_TEMP/access.jwt")")" \\
              -H 'Content-Type: application/json' \\
              -d '$(jq . <<<"$payload")'
          EOF
          status=000
          # A newly created identity takes a few seconds to propagate; retry briefly.
          for attempt in 1 2 3 4 5 6 7 8; do
            status=$(curl -sS -o "$out" -w '%{http_code}' --max-time 30 -X POST "${APP_URL%/}/api/deployments" \
              -H "CF-Access-Client-Id: $EDGE_CLIENT_ID" -H "CF-Access-Client-Secret: $EDGE_CLIENT_SECRET" \
              -H "Authorization: Bearer $(cat "$RUNNER_TEMP/access.jwt")" \
              -H 'Content-Type: application/json' -d "$payload" || echo 000)
            case "$status" in
              000|502|503|504|530) echo "attempt $attempt: HTTP $status, retrying"; sleep 3 ;;
              403) if grep -q 'does not exist' "$out"; then echo "attempt $attempt: identity not propagated yet, retrying"; sleep 2; else break; fi ;;
              *) break ;;
            esac
          done
          echo "HTTP $status"
          jq . "$out" 2>/dev/null || cat "$out"
          echo
          if [ "$status" = 201 ]; then
            echo "deployment recorded"
            echo "## ✅ Deployed ${GITHUB_REF_NAME}@${GITHUB_SHA::7} ($DEPLOY_ENV)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error title=Deployment refused::HTTP $status"
          echo "## ❌ Deployment refused (HTTP $status)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
